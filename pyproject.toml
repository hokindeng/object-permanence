[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "object-permanence"
dynamic = ["version"]
description = "Object-permanence video reasoning data factory: Blender-rendered video-to-video samples"
readme = "README.md"
requires-python = ">=3.9"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "LICENSE-OpenMDW-1.1"]
authors = [
    {name = "Hokin Deng"},
]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://object-permanence.world"
Repository = "https://github.com/hokindeng/object-permanence"
Dataset = "https://huggingface.co/datasets/Hokin/object-permanence"
Benchmark = "https://huggingface.co/datasets/Hokin/object-permanence-benchmark"
Model = "https://huggingface.co/Hokin/PWM-WROP"

[project.scripts]
object-permanence = "object_permanence.cli:main"

[tool.setuptools.dynamic]
version = {attr = "object_permanence.__version__"}

[tool.setuptools.packages.find]
include = ["object_permanence*"]

[tool.setuptools.package-data]
"object_permanence.generator" = ["tasks/*/task.json", "tasks/*/*.py"]
